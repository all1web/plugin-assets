<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#E1E9F8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF3FF"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C6E90" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5C6E90" stop-opacity="0"/>
    </radialGradient>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="150" rx="14" fill="url(#bg)"/>

  <!-- === step 1: someone taps Share in any app === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(150,44)" filter="url(#tight)">
    <g transform="translate(0,5)"><rect x="-26" y="-22" width="52" height="42" rx="8" fill="#C6D3EB"/></g>
    <rect x="-26" y="-22" width="52" height="42" rx="8" fill="#FFFFFF"/>
    <rect x="-19" y="-14" width="30" height="3.4" rx="1.7" fill="#C3D0E6"/>
    <rect x="-19" y="-7" width="22" height="3.2" rx="1.6" fill="#DCE4F3"/>
    <g transform="translate(-19,2)">
      <circle cx="3.6" cy="7.4" r="3.4" fill="#7C5CFC"/>
      <circle cx="14" cy="2.6" r="3.4" fill="#7C5CFC"/>
      <circle cx="14" cy="12.2" r="3.4" fill="#7C5CFC"/>
      <path d="M6.9 5.9 L10.8 3.6 M6.9 8.9 L10.8 11.2" stroke="#7C5CFC" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
  <text x="150" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Tap Share, anywhere</text>
  <text x="150" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">links, text, photos, files</text>

  <!-- === step 2: your app is in the sheet, payload lands in the inbox === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(440,42)" filter="url(#tight)">
    <g transform="translate(0,5)"><rect x="-16" y="-26" width="32" height="52" rx="7" fill="#222B44"/></g>
    <rect x="-16" y="-26" width="32" height="52" rx="7" fill="#2B3550"/>
    <rect x="-12.5" y="-21" width="25" height="42" rx="4" fill="url(#screen)"/>
    <rect x="-4" y="-18" width="8" height="2" rx="1" fill="#C3D0E6"/>
    <g>
      <rect x="-9.5" y="-12" width="19" height="9" rx="2.6" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.7"/>
      <rect x="-9.5" y="-12" width="2" height="9" rx="1" fill="#7C5CFC"/>
      <rect x="-5" y="-9.8" width="5" height="5" rx="1.5" fill="#7C5CFC"/>
      <rect x="1.5" y="-9.4" width="7" height="2" rx="1" fill="#41506F" opacity="0.75"/>
      <rect x="-9.5" y="-1" width="19" height="9" rx="2.6" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.7"/>
      <rect x="-5" y="1.2" width="5" height="5" rx="1.5" fill="#C3D0E6"/>
      <rect x="1.5" y="1.6" width="6" height="2" rx="1" fill="#93A2BF" opacity="0.6"/>
      <rect x="-9.5" y="10" width="19" height="9" rx="2.6" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.7"/>
      <rect x="-5" y="12.2" width="5" height="5" rx="1.5" fill="#C3D0E6"/>
      <rect x="1.5" y="12.6" width="6" height="2" rx="1" fill="#93A2BF" opacity="0.6"/>
    </g>
  </g>
  <g transform="translate(474,20)" filter="url(#tight)">
    <rect width="66" height="24" rx="7" fill="#FFFFFF"/>
    <text x="9" y="15.6" font-size="9.5" font-weight="700" fill="#41506F">Inbox</text>
    <g transform="translate(44,7)">
      <rect width="15" height="10" rx="5" fill="#7C5CFC"/>
      <text x="4.6" y="7.6" font-size="6.6" font-weight="700" fill="#FFFFFF">3</text>
    </g>
  </g>
  <text x="440" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Your app is in the sheet</text>
  <text x="440" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">held natively, even if closed</text>

  <!-- === step 3: plain PHP receives it === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(730,40)" filter="url(#tight)">
    <g transform="translate(0,6)"><rect x="-32" y="-20" width="64" height="44" rx="9" fill="#2C55C9"/></g>
    <rect x="-32" y="-20" width="64" height="44" rx="9" fill="#3B6FF5"/>
    <text x="-24" y="-6" font-size="10" font-weight="700" fill="#FFFFFF">PHP</text>
    <rect x="-24" y="0" width="46" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5"/>
    <rect x="-24" y="6" width="30" height="3" rx="1.5" fill="#FFFFFF" opacity="0.36"/>
    <g transform="translate(0,-14)">
      <rect width="28" height="11" rx="5.5" fill="#FFFFFF" opacity="0.94"/>
      <text x="4.6" y="8.2" font-size="7" font-weight="700" fill="#2C55C9">$item</text>
    </g>
  </g>
  <text x="730" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Plain PHP receives it</text>
  <text x="730" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">url, text, image or file</text>

  <!-- === arrows === -->
  <g stroke="#9DB0CE" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M222 62 H352"/>
    <path d="M556 62 H642"/>
  </g>
  <g fill="#9DB0CE">
    <path d="M352 62 L344 57.5 L344 66.5 Z"/>
    <path d="M642 62 L634 57.5 L634 66.5 Z"/>
  </g>

</svg>
