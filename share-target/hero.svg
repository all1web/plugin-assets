<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#DCE5F7"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.62" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="slabTop" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F2F6FD"/>
      <stop offset="1" stop-color="#E1EAF8"/>
    </linearGradient>
    <linearGradient id="slabEdgeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD7EC"/>
      <stop offset="1" stop-color="#A9BAD9"/>
    </linearGradient>
    <linearGradient id="slabEdgeR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C8E4"/>
      <stop offset="1" stop-color="#94A8CC"/>
    </linearGradient>

    <linearGradient id="pad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7C5CFC" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C5CFC" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="phoneBody" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#39456A"/>
      <stop offset="1" stop-color="#232C48"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F0FF"/>
    </linearGradient>

    <linearGradient id="cardTop" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2FC"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5183F8"/>
      <stop offset="1" stop-color="#3163E4"/>
    </linearGradient>
    <linearGradient id="inkCard" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#28324F"/>
      <stop offset="1" stop-color="#161E36"/>
    </linearGradient>

    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4E5F80" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4E5F80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C6E90" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5C6E90" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="13"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.26"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="micro" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="360" rx="18" fill="url(#bg)"/>
  <rect width="880" height="360" rx="18" fill="url(#vign)"/>

  <!-- === LEFT: value proposition === -->
  <text x="56" y="120" font-size="38" font-weight="700" fill="#1B2440">Let people share</text>
  <text x="56" y="166" font-size="38" font-weight="700" fill="#7C5CFC">into your app.</text>

  <text x="57" y="207" font-size="14.5" fill="#5B6785">Your app joins the OS share sheet, so links,</text>
  <text x="57" y="228" font-size="14.5" fill="#5B6785">text, photos, videos and PDFs land in a native</text>
  <text x="57" y="249" font-size="14.5" fill="#5B6785">inbox — even when the app was closed.</text>

  <g filter="url(#tight)">
    <rect x="56" y="277" width="356" height="42" rx="10" fill="#1B2440"/>
  </g>
  <rect x="56" y="277" width="356" height="1.6" rx="0.8" fill="#FFFFFF" opacity="0.16"/>
  <text x="74" y="303" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#C4B5FD">$items = ShareTarget::<tspan fill="#FFB4A8">pending</tspan>();</text>

  <!-- === RIGHT: isometric diorama === -->

  <ellipse cx="662" cy="268" rx="178" ry="62" fill="url(#ambient)"/>

  <!-- ground slab: layered extrusion for a thicker, angled read -->
  <g filter="url(#soft)">
    <g transform="translate(0,20)">
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect width="196" height="196" rx="16" fill="url(#slabEdgeR)"/>
      </g>
    </g>
    <g transform="translate(0,13)">
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect width="196" height="196" rx="16" fill="url(#slabEdgeL)"/>
      </g>
    </g>
    <g transform="translate(0,6)">
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect width="196" height="196" rx="16" fill="#C7D4EA"/>
      </g>
    </g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
      <rect width="196" height="196" rx="16" fill="url(#slabTop)"/>
      <rect x="1" y="1" width="194" height="194" rx="15" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>
      <g stroke="#CFDAEE" stroke-width="1.05" opacity="0.72">
        <path d="M0 40 H196 M0 82 H196 M0 124 H196 M0 164 H196"/>
        <path d="M38 0 V196 M78 0 V196 M118 0 V196 M158 0 V196"/>
      </g>
      <rect x="42" y="44" width="112" height="112" rx="18" fill="url(#pad)" stroke="#7C5CFC" stroke-width="2.3" stroke-dasharray="10 7"/>
      <rect x="52" y="54" width="92" height="92" rx="13" fill="none" stroke="#7C5CFC" stroke-width="0.9" opacity="0.28"/>
    </g>
  </g>

  <!-- props standing on the slab -->
  <g transform="translate(786,182)">
    <ellipse cx="0" cy="10" rx="17" ry="7" fill="url(#contact)"/>
    <g stroke="#A9BAD9" stroke-width="0.9" stroke-linejoin="round">
      <path d="M-14 7 L0 -1 L14 7 L0 15 Z" fill="#BECCE6"/>
      <path d="M-14 1.5 L0 -6.5 L14 1.5 L0 9.5 Z" fill="#DCE6F6"/>
      <path d="M-14 -4 L0 -12 L14 -4 L0 4 Z" fill="#FFFFFF"/>
    </g>
    <path d="M-7 -4.6 L-2.2 -7.4 L1.6 -5 L5.2 -7.8 L9 -4.4 L0 0.8 Z" fill="#9DB0CE"/>
    <circle cx="-6.4" cy="-7.2" r="1.7" fill="#C3D0E6"/>
  </g>

  <g transform="translate(568,196)">
    <ellipse cx="0" cy="9" rx="15" ry="6.5" fill="url(#contact)"/>
    <g stroke="#A9BAD9" stroke-width="0.9" stroke-linejoin="round">
      <path d="M-13 3 L0 -4.5 L13 3 L0 10.5 Z" fill="#E9F0FB"/>
      <path d="M-13 3 V-10 L0 -17.5 V-4.5 Z" fill="#FBFDFF"/>
      <path d="M13 3 V-10 L0 -17.5 V-4.5 Z" fill="#C3D0E6"/>
    </g>
    <path d="M-13 3 L0 -4.5 L13 3" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- connectors -->
  <g stroke="#9DB0CE" stroke-width="1.35" fill="none" stroke-linecap="round">
    <path d="M664 70 L706 72"/>
    <path d="M608 92 L606 128"/>
    <path d="M758 101 L732 124"/>
    <path d="M658 158 L634 198"/>
  </g>
  <g fill="#FFFFFF" stroke="#8FA4C6" stroke-width="1.35">
    <rect x="681.5" y="67" width="7.4" height="7.4" rx="1.8"/>
    <rect x="603.5" y="106.5" width="7.4" height="7.4" rx="1.8"/>
    <rect x="741.5" y="109" width="7.4" height="7.4" rx="1.8"/>
    <rect x="642.5" y="174.5" width="7.4" height="7.4" rx="1.8"/>
  </g>

  <!-- === phone: the OS share sheet, your app listed first === -->
  <g filter="url(#soft)">
    <g transform="translate(16,-56)">
      <g transform="translate(0,12)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
          <rect x="64" y="28" width="62" height="120" rx="12" fill="#1A2238"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect x="64" y="28" width="62" height="120" rx="12" fill="url(#phoneBody)"/>
        <rect x="65.6" y="29.6" width="58.8" height="116.8" rx="10.5" fill="none" stroke="#6E7DA6" stroke-width="1" opacity="0.55"/>
        <rect x="69" y="35" width="52" height="106" rx="7" fill="url(#screen)"/>

        <rect x="87" y="40" width="16" height="2.6" rx="1.3" fill="#C3D0E6"/>

        <rect x="74" y="48" width="42" height="28" rx="4.5" fill="#E5EDFC"/>
        <path d="M81 70 L90 58 L97 67 L103 61 L108 70 Z" fill="#B9C8E4"/>
        <circle cx="85" cy="56" r="3.4" fill="#D4E0F5"/>

        <g>
          <rect x="74" y="82" width="42" height="14.5" rx="3.8" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.8"/>
          <rect x="74" y="82" width="3" height="14.5" rx="1.5" fill="#7C5CFC"/>
          <rect x="80.5" y="85.6" width="8.2" height="8.2" rx="2.3" fill="#7C5CFC"/>
          <rect x="92" y="86" width="19" height="2.9" rx="1.45" fill="#41506F" opacity="0.8"/>
          <rect x="92" y="91.2" width="11" height="2.4" rx="1.2" fill="#93A2BF" opacity="0.72"/>

          <rect x="74" y="100.5" width="42" height="14.5" rx="3.8" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.8"/>
          <rect x="80.5" y="104.1" width="8.2" height="8.2" rx="2.3" fill="#C3D0E6"/>
          <rect x="92" y="104.5" width="16" height="2.9" rx="1.45" fill="#41506F" opacity="0.36"/>
          <rect x="92" y="109.7" width="9" height="2.4" rx="1.2" fill="#93A2BF" opacity="0.4"/>

          <rect x="74" y="119" width="42" height="14.5" rx="3.8" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.8"/>
          <rect x="80.5" y="122.6" width="8.2" height="8.2" rx="2.3" fill="#C3D0E6"/>
          <rect x="92" y="123" width="18" height="2.9" rx="1.45" fill="#41506F" opacity="0.36"/>
          <rect x="92" y="128.2" width="8" height="2.4" rx="1.2" fill="#93A2BF" opacity="0.4"/>
        </g>
      </g>
    </g>
  </g>

  <!-- === card: someone taps Share in any app === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-62)">
      <g transform="translate(0,8)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
          <rect x="-6" y="16" width="60" height="35" rx="7.5" fill="#B9C8E4"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect x="-6" y="16" width="60" height="35" rx="7.5" fill="url(#cardTop)"/>
        <rect x="-4.6" y="17.4" width="57.2" height="32.2" rx="6.4" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
        <g transform="translate(2,23)">
          <circle cx="3.6" cy="7.2" r="3.4" fill="#5B6785"/>
          <circle cx="13.4" cy="2.7" r="3.4" fill="#5B6785"/>
          <circle cx="13.4" cy="11.7" r="3.4" fill="#5B6785"/>
          <path d="M6.7 5.7 L10.3 3.5 M6.7 8.7 L10.3 10.9" stroke="#5B6785" stroke-width="1.35" stroke-linecap="round"/>
        </g>
        <text x="23" y="33.6" font-size="10.5" font-weight="700" fill="#41506F">Share</text>
        <rect x="2" y="40" width="48" height="2.8" rx="1.4" fill="#D7E0F1"/>
      </g>
    </g>
  </g>

  <!-- === card: plain PHP receives the payload === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-56)">
      <g transform="translate(0,8)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
          <rect x="144" y="60" width="66" height="37" rx="7.5" fill="#2748AE"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect x="144" y="60" width="66" height="37" rx="7.5" fill="url(#cobalt)"/>
        <rect x="145.4" y="61.4" width="63.2" height="34.2" rx="6.4" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.28"/>
        <text x="152" y="75" font-size="10" font-weight="700" fill="#FFFFFF">PHP</text>
        <rect x="152" y="80" width="48" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.48"/>
        <rect x="152" y="86" width="31" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.34"/>
        <g transform="translate(175,70)">
          <rect width="29" height="10.5" rx="5.25" fill="#FFFFFF" opacity="0.94"/>
          <text x="4.8" y="7.7" font-size="6.3" font-weight="700" fill="#2C55C9">$item</text>
        </g>
      </g>
    </g>
  </g>

  <!-- === card: the native inbox holds it === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-62)">
      <g transform="translate(0,8)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
          <rect x="-18" y="104" width="62" height="35" rx="7.5" fill="#B9C8E4"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect x="-18" y="104" width="62" height="35" rx="7.5" fill="url(#cardTop)"/>
        <rect x="-16.6" y="105.4" width="59.2" height="32.2" rx="6.4" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
        <text x="-10" y="118" font-size="10" font-weight="700" fill="#41506F">Inbox</text>
        <g transform="translate(20,109)">
          <rect width="17" height="10.5" rx="5.25" fill="#7C5CFC"/>
          <text x="5.6" y="7.7" font-size="6.6" font-weight="700" fill="#FFFFFF">3</text>
        </g>
        <rect x="-10" y="123.5" width="46" height="3" rx="1.5" fill="#C6D3EB"/>
        <rect x="-10" y="129.5" width="31" height="2.7" rx="1.35" fill="#DDE5F4"/>
      </g>
    </g>
  </g>

  <!-- === chip: nothing is lost while the app is closed === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-10)">
      <g transform="translate(0,7)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
          <rect x="116" y="152" width="66" height="27" rx="7.5" fill="#0D1424"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,662,74)">
        <rect x="116" y="152" width="66" height="27" rx="7.5" fill="url(#inkCard)"/>
        <rect x="117.4" y="153.4" width="63.2" height="24.2" rx="6.4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.13"/>
        <rect x="125" y="160.5" width="8.4" height="7" rx="1.7" fill="none" stroke="#FF6B5A" stroke-width="1.45"/>
        <path d="M126.7 160.5 V158.8 A2.5 2.5 0 0 1 131.7 158.8 V160.5" stroke="#FF6B5A" stroke-width="1.35" fill="none"/>
        <text x="139" y="167.6" font-size="8.8" font-weight="700" fill="#FFFFFF">app closed</text>
      </g>
    </g>
  </g>

</svg>
