<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#E1E9F8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C6E90" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5C6E90" stop-opacity="0"/>
    </radialGradient>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="150" rx="14" fill="url(#bg)"/>

  <!-- === step 1: push from Laravel === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(150,44)" filter="url(#tight)">
    <g transform="translate(0,5)"><rect x="-32" y="-16" width="64" height="34" rx="8" fill="#0F1526"/></g>
    <rect x="-32" y="-16" width="64" height="34" rx="8" fill="#1B2440"/>
    <circle cx="-22" cy="-4" r="3.6" fill="#F59E0B"/>
    <rect x="-14" y="-7" width="36" height="4.4" rx="2.2" fill="#FDD79B"/>
    <rect x="-22" y="4" width="30" height="3.6" rx="1.8" fill="#FFFFFF" opacity="0.4"/>
    <rect x="-22" y="10" width="20" height="3.2" rx="1.6" fill="#FFFFFF" opacity="0.28"/>
  </g>
  <text x="150" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Push from Laravel</text>
  <text x="150" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">Widgets::update('today', ...)</text>

  <!-- === step 2: the widget repaints instantly === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/>
      <rect x="12" y="12" width="42" height="30" rx="6" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 4"/>
    </g>
  </g>
  <g transform="translate(440,42)" filter="url(#tight)">
    <g transform="translate(0,5)"><rect x="-30" y="-19" width="60" height="42" rx="8" fill="#D97706"/></g>
    <rect x="-30" y="-19" width="60" height="42" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="-23" y="-12" width="24" height="5" rx="2.5" fill="#1B2440"/>
    <circle cx="21" cy="-9" r="4.6" fill="#F59E0B"/>
    <rect x="-23" y="-1" width="40" height="4" rx="2" fill="#41506F" opacity="0.65"/>
    <rect x="-23" y="7" width="30" height="3.6" rx="1.8" fill="#93A2BF" opacity="0.7"/>
    <rect x="-23" y="14" width="34" height="3.6" rx="1.8" fill="#93A2BF" opacity="0.5"/>
  </g>
  <text x="440" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Widget repaints instantly</text>
  <text x="440" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">native store — offline-safe, reboot-proof</text>

  <!-- === step 3: tap deep-links === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(730,44)" filter="url(#tight)">
    <g transform="translate(0,5)"><rect x="-14" y="-26" width="28" height="50" rx="7" fill="#222B44"/></g>
    <rect x="-14" y="-26" width="28" height="50" rx="7" fill="#2B3550"/>
    <rect x="-10.5" y="-21" width="21" height="40" rx="4" fill="#F2F6FF"/>
    <rect x="-7" y="-16" width="14" height="4" rx="2" fill="#FF6B5A"/>
    <rect x="-7" y="-6" width="14" height="2.6" rx="1.3" fill="#C3D0E6"/>
    <rect x="-7" y="-1" width="10" height="2.4" rx="1.2" fill="#DCE4F3"/>
    <rect x="-7" y="6" width="14" height="2.6" rx="1.3" fill="#C3D0E6"/>
    <rect x="-7" y="11" width="8" height="2.4" rx="1.2" fill="#DCE4F3"/>
    <circle cx="10" cy="-22" r="7" fill="none" stroke="#FF6B5A" stroke-width="1.6" opacity="0.9"/>
    <circle cx="10" cy="-22" r="2.4" fill="#FF6B5A"/>
  </g>
  <text x="730" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Tap deep-links</text>
  <text x="730" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">straight to the exact screen</text>

  <!-- === arrows === -->
  <g stroke="#9DB0CE" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M222 62 H352"/>
    <path d="M512 62 H642"/>
  </g>
  <g fill="#9DB0CE">
    <path d="M352 62 L344 57.5 L344 66.5 Z"/>
    <path d="M642 62 L634 57.5 L634 66.5 Z"/>
  </g>

</svg>
