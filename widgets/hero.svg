<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#DCE5F7"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF3FF"/>
    </linearGradient>
    <linearGradient id="widgetGlow" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C6E90" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5C6E90" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="11"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.24"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="360" rx="18" fill="url(#bg)"/>

  <!-- === LEFT: value proposition === -->
  <text x="56" y="120" font-size="38" font-weight="700" fill="#1B2440">Your app, on the</text>
  <text x="56" y="166" font-size="38" font-weight="700" fill="#F59E0B">home screen.</text>

  <text x="57" y="207" font-size="14.5" fill="#5B6785">Push content from Laravel. The widget</text>
  <text x="57" y="228" font-size="14.5" fill="#5B6785">renders natively, works offline, and</text>
  <text x="57" y="249" font-size="14.5" fill="#5B6785">survives reboots. Zero native code.</text>

  <g filter="url(#tight)">
    <rect x="56" y="277" width="356" height="42" rx="10" fill="#1B2440"/>
  </g>
  <text x="74" y="303" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#FDD79B">Widgets::update(<tspan fill="#FFB4A8">'today'</tspan>, [...]);</text>

  <!-- === RIGHT: isometric diorama === -->

  <!-- ground slab: a launcher grid, 190x190 iso at (660,88) -->
  <g filter="url(#soft)">
    <g transform="translate(0,9)">
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect width="190" height="190" rx="15" fill="#BFCCE5"/>
      </g>
    </g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
      <rect width="190" height="190" rx="15" fill="url(#slabTop)"/>
      <!-- launcher app-icon placeholders -->
      <g fill="#C3D0E6" opacity="0.75">
        <rect x="22" y="118" width="28" height="28" rx="7"/>
        <rect x="62" y="118" width="28" height="28" rx="7"/>
        <rect x="22" y="156" width="28" height="20" rx="7"/>
        <rect x="62" y="156" width="28" height="20" rx="7"/>
        <rect x="146" y="22" width="26" height="26" rx="7"/>
        <rect x="146" y="58" width="26" height="26" rx="7"/>
      </g>
      <!-- the widget's footprint on the home screen, amber-marked -->
      <rect x="18" y="20" width="112" height="76" rx="10" fill="url(#widgetGlow)" stroke="#F59E0B" stroke-width="2.4" stroke-dasharray="9 7"/>
    </g>
  </g>

  <!-- props standing on the slab -->
  <g transform="translate(742,224)">
    <ellipse cx="0" cy="6" rx="14" ry="6" fill="url(#contact)"/>
    <path d="M0 -29 L11 -6 L-11 -6 Z" fill="#FBBF24"/>
    <path d="M0 -18 L13 4 L-13 4 Z" fill="#F59E0B"/>
    <rect x="-2.6" y="2" width="5.2" height="8" rx="2" fill="#8B6B52"/>
  </g>
  <g transform="translate(566,214)">
    <ellipse cx="0" cy="6" rx="15" ry="6" fill="url(#contact)"/>
    <path d="M-13 1 L0 -6 L13 1 L0 8 Z" fill="#E4EBF8"/>
    <path d="M-13 1 V-13 L0 -20 V-6 Z" fill="#FFFFFF"/>
    <path d="M13 1 V-13 L0 -20 V-6 Z" fill="#C9D6EC"/>
  </g>

  <!-- connectors, beneath the floating cards; both ends touch elements -->
  <g stroke="#9DB0CE" stroke-width="1.3" fill="none">
    <path d="M666 86 L685 96"/>
    <path d="M741 128 L729 139"/>
    <path d="M652 180 L637 206"/>
  </g>
  <g fill="#FFFFFF" stroke="#9DB0CE" stroke-width="1.3">
    <rect x="661.5" y="81.5" width="7" height="7" rx="1.6"/>
    <rect x="737.5" y="124.5" width="7" height="7" rx="1.6"/>
    <rect x="648.5" y="175.5" width="7" height="7" rx="1.6"/>
  </g>

  <!-- === the phone, floating above its widget footprint === -->
  <g filter="url(#soft)">
    <g transform="translate(14,-52)">
      <g transform="translate(0,10)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="65" y="30" width="60" height="116" rx="11" fill="#222B44"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="65" y="30" width="60" height="116" rx="11" fill="#2B3550"/>
        <rect x="70" y="37" width="50" height="102" rx="6" fill="url(#screen)"/>

        <!-- THE widget card on the home screen: the primary subject -->
        <rect x="74" y="43" width="42" height="40" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/>
        <text x="78" y="53" font-size="9" font-weight="700" fill="#1B2440">Today</text>
        <circle cx="110" cy="50" r="4" fill="#F59E0B"/>
        <rect x="78" y="59" width="30" height="3.4" rx="1.7" fill="#41506F" opacity="0.7"/>
        <rect x="78" y="66" width="22" height="3" rx="1.5" fill="#93A2BF" opacity="0.75"/>
        <rect x="78" y="73" width="26" height="3" rx="1.5" fill="#93A2BF" opacity="0.55"/>

        <!-- launcher rows beneath the widget -->
        <g fill="#E7EFFD">
          <rect x="74" y="90" width="12" height="12" rx="3.5"/>
          <rect x="89" y="90" width="12" height="12" rx="3.5"/>
          <rect x="104" y="90" width="12" height="12" rx="3.5"/>
          <rect x="74" y="106" width="12" height="12" rx="3.5"/>
          <rect x="89" y="106" width="12" height="12" rx="3.5"/>
          <rect x="104" y="106" width="12" height="12" rx="3.5"/>
        </g>
        <rect x="74" y="124" width="42" height="10" rx="5" fill="#E1E9F8"/>
      </g>
    </g>
  </g>

  <!-- === beat 1: the PHP push === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-56)">
      <g transform="translate(0,7)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="-6" y="18" width="60" height="32" rx="7" fill="#0F1526"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="-6" y="18" width="60" height="32" rx="7" fill="#1B2440"/>
        <circle cx="4" cy="29" r="4" fill="#F59E0B"/>
        <text x="12" y="32.6" font-size="10" font-weight="700" fill="#FFFFFF">update()</text>
        <rect x="2" y="39" width="42" height="2.6" rx="1.3" fill="#FFFFFF" opacity="0.45"/>
      </g>
    </g>
  </g>

  <!-- === beat 2: the native store persists === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-50)">
      <g transform="translate(0,7)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="140" y="62" width="62" height="34" rx="7" fill="#2C55C9"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="140" y="62" width="62" height="34" rx="7" fill="#3B6FF5"/>
        <text x="148" y="76" font-size="10" font-weight="700" fill="#FFFFFF">STORE</text>
        <rect x="148" y="81" width="44" height="2.6" rx="1.3" fill="#FFFFFF" opacity="0.45"/>
        <rect x="148" y="86.5" width="28" height="2.4" rx="1.2" fill="#FFFFFF" opacity="0.32"/>
        <g transform="translate(176,84)">
          <rect width="22" height="9" rx="4.5" fill="#FFFFFF" opacity="0.92"/>
          <text x="3" y="6.8" font-size="6" font-weight="700" fill="#2C55C9">saved</text>
        </g>
      </g>
    </g>
  </g>

  <!-- === beat 3: a tap deep-links into the exact screen === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-10)">
      <g transform="translate(0,6)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="114" y="150" width="66" height="28" rx="7" fill="#E0553F"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="114" y="150" width="66" height="28" rx="7" fill="#FF6B5A"/>
        <circle cx="125" cy="164" r="4.6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="125" cy="164" r="1.7" fill="#FFFFFF"/>
        <text x="133" y="168" font-size="10" font-weight="700" fill="#FFFFFF">TAP</text>
        <rect x="155" y="160" width="18" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
      </g>
    </g>
  </g>

</svg>
