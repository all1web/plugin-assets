<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#E1E9F8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C6E90" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5C6E90" stop-opacity="0"/>
    </radialGradient>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="150" rx="14" fill="url(#bg)"/>

  <!-- === step 1: register from PHP === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/>
      <circle cx="33" cy="33" r="20" fill="#17B8A6" fill-opacity="0.20" stroke="#17B8A6" stroke-width="1.8" stroke-dasharray="6 4.5"/>
    </g>
  </g>
  <g transform="translate(150,44)" filter="url(#tight)">
    <g transform="translate(0,5)"><rect x="-14" y="-26" width="28" height="50" rx="7" fill="#222B44"/></g>
    <rect x="-14" y="-26" width="28" height="50" rx="7" fill="#2B3550"/>
    <rect x="-10.5" y="-21" width="21" height="40" rx="4" fill="#F2F6FF"/>
    <circle cx="0" cy="-6" r="6.5" fill="#17B8A6" fill-opacity="0.25" stroke="#17B8A6" stroke-width="1.3"/>
    <rect x="-7" y="6" width="14" height="2.6" rx="1.3" fill="#C3D0E6"/>
    <rect x="-7" y="11" width="9" height="2.4" rx="1.2" fill="#DCE4F3"/>
  </g>
  <text x="150" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Register from PHP</text>
  <text x="150" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">id, lat, lng, radius</text>

  <!-- === step 2: the app dies, the fence does not === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/>
      <circle cx="33" cy="33" r="20" fill="#17B8A6" fill-opacity="0.20" stroke="#17B8A6" stroke-width="1.8" stroke-dasharray="6 4.5"/>
    </g>
  </g>
  <ellipse cx="440" cy="66" rx="15" ry="6" fill="url(#contact)"/>
  <g transform="translate(440,63)" filter="url(#tight)">
    <path d="M0 0 C-11 -15 -17 -22 -17 -31 A17 17 0 0 1 17 -31 C17 -22 11 -15 0 0 Z" fill="#FF6B5A"/>
    <circle cx="0" cy="-31" r="6.2" fill="#FFFFFF"/>
  </g>
  <g transform="translate(478,26)" filter="url(#tight)">
    <rect width="62" height="24" rx="7" fill="#1B2440"/>
    <circle cx="13" cy="12" r="4.4" fill="none" stroke="#FF6B5A" stroke-width="1.5"/>
    <path d="M13 8.4 V12" stroke="#FF6B5A" stroke-width="1.5" stroke-linecap="round"/>
    <text x="22" y="15.6" font-size="9" font-weight="700" fill="#FFFFFF">killed</text>
  </g>
  <text x="440" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">App dies, fence lives</text>
  <text x="440" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">re-armed on reboot</text>

  <!-- === step 3: native POST to your server === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(730,40)" filter="url(#tight)">
    <g transform="translate(0,6)"><rect x="-30" y="-20" width="60" height="44" rx="9" fill="#2C55C9"/></g>
    <rect x="-30" y="-20" width="60" height="44" rx="9" fill="#3B6FF5"/>
    <rect x="-22" y="-12" width="44" height="5" rx="2.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="-22" y="-2" width="30" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
    <g transform="translate(-4,9)">
      <rect width="26" height="11" rx="5.5" fill="#FFFFFF" opacity="0.94"/>
      <text x="5" y="8.2" font-size="7.5" font-weight="700" fill="#2C55C9">200</text>
    </g>
  </g>
  <text x="730" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Native HTTPS POST</text>
  <text x="730" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">your server, your truth</text>

  <!-- === arrows === -->
  <g stroke="#9DB0CE" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M222 62 H352"/>
    <path d="M512 62 H642"/>
  </g>
  <g fill="#9DB0CE">
    <path d="M352 62 L344 57.5 L344 66.5 Z"/>
    <path d="M642 62 L634 57.5 L634 66.5 Z"/>
  </g>

</svg>
