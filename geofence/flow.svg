<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1A2337"/>
      <stop offset="1" stop-color="#131B2B"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#8B7CF8"/>
    </linearGradient>
  </defs>

  <rect width="880" height="150" rx="16" fill="url(#bgDark)"/>

  <!-- === card 1: register === -->
  <g transform="translate(34,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="#2E3D60" stroke-width="1.2"/>
    <g transform="translate(27,25)">
      <path d="M0 0 C-5.5 -7.5 -8.5 -11 -8.5 -15.5 A8.5 8.5 0 0 1 8.5 -15.5 C8.5 -11 5.5 -7.5 0 0 Z" fill="#FF6B5A"/>
      <circle cx="0" cy="-15.5" r="3" fill="#FFE4DF"/>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">Register from PHP</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">id · lat · lng · radius</text>
  </g>

  <!-- === card 2: app dies === -->
  <g transform="translate(246,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="#2E3D60" stroke-width="1.2"/>
    <g transform="translate(57,26)">
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#FF6B5A" stroke-width="2"/>
      <path d="M0 -6.5 V0" stroke="#FF6B5A" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">App dies</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">fence stays armed, reboot-proof</text>
  </g>

  <!-- === card 3: boundary crossed === -->
  <g transform="translate(458,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="#2E3D60" stroke-width="1.2"/>
    <g transform="translate(30,26)" stroke="#2DD4BF" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="2.4" fill="#2DD4BF" stroke="none"/>
      <path d="M5 -5 A7 7 0 0 1 5 5" stroke-width="1.8"/>
      <path d="M9 -9 A12.5 12.5 0 0 1 9 9" stroke-width="1.8" opacity="0.65"/>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">Boundary crossed</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">the OS wakes native code</text>
  </g>

  <!-- === card 4: your server told (highlighted) === -->
  <g transform="translate(670,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="url(#hi)" stroke-width="2"/>
    <g transform="translate(47,26)">
      <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#34C77B"/>
      <path d="M-4 0 L-1 3.5 L5 -3.5" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">Server told</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">HTTPS POST · bearer · retries</text>
  </g>

</svg>
