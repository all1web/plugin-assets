<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1B2438"/>
      <stop offset="1" stop-color="#141C2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EA3F7"/>
      <stop offset="1" stop-color="#8B7CF8"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#232F4C"/>
      <stop offset="1" stop-color="#1B2438"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="880" height="360" rx="20" fill="url(#bgDark)"/>

  <!-- === LEFT: value proposition === -->
  <text x="56" y="120" font-size="38" font-weight="700" fill="#F4F7FC">Fences that</text>
  <text x="56" y="166" font-size="38" font-weight="700" fill="url(#accent)">outlive your app.</text>

  <text x="57" y="207" font-size="14.5" fill="#8E9BB5">OS-level geofences that survive app death</text>
  <text x="57" y="228" font-size="14.5" fill="#8E9BB5">and reboot. Enter/exit reported to your</text>
  <text x="57" y="249" font-size="14.5" fill="#8E9BB5">server from native code, with no PHP running.</text>

  <rect x="56" y="277" width="360" height="42" rx="10" fill="#10182A" stroke="#263452" stroke-width="1.2"/>
  <text x="74" y="303" font-size="13.5" font-family="Consolas, Menlo, monospace"><tspan fill="#4EC9B0">Geofence</tspan><tspan fill="#8E9BB5">::</tspan><tspan fill="#4EA3F7">register</tspan><tspan fill="#C8D3E8">(</tspan><tspan fill="#E8A87C">'warehouse'</tspan><tspan fill="#C8D3E8">, ...);</tspan></text>

  <!-- === RIGHT: dark iso map floor === -->

  <!-- floor slab: iso 200x200 at (655,52) -->
  <g>
    <g transform="translate(0,10)">
      <g transform="matrix(0.866,0.5,-0.866,0.5,655,52)">
        <rect width="200" height="200" rx="10" fill="#101726"/>
      </g>
    </g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,655,52)">
      <rect width="200" height="200" rx="10" fill="url(#slabTop)"/>
      <g stroke="#2A3A5C" stroke-width="1" opacity="0.7">
        <path d="M0 50 H200 M0 100 H200 M0 150 H200"/>
        <path d="M50 0 V200 M100 0 V200 M150 0 V200"/>
      </g>

      <!-- faint second fence, violet, for depth -->
      <circle cx="163" cy="42" r="30" fill="none" stroke="#8B7CF8" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.4"/>
      <circle cx="163" cy="42" r="2.2" fill="#8B7CF8" opacity="0.5"/>

      <!-- the geofence: glow pass, then crisp pass -->
      <circle cx="92" cy="108" r="62" fill="#2DD4BF" fill-opacity="0.07"/>
      <circle cx="92" cy="108" r="62" fill="none" stroke="#2DD4BF" stroke-width="5" opacity="0.55" filter="url(#glow)"/>
      <circle cx="92" cy="108" r="62" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-dasharray="10 7"/>
      <circle cx="92" cy="108" r="3.6" fill="#2DD4BF"/>
    </g>
  </g>

  <!-- pin at the fence centre: slab(92,108) -> screen (641.1, 152) -->
  <g transform="translate(641,152)">
    <ellipse cx="0" cy="2" rx="12" ry="4.5" fill="#000000" opacity="0.35"/>
    <path d="M0 0 C-11 -15 -17 -22 -17 -31 A17 17 0 0 1 17 -31 C17 -22 11 -15 0 0 Z" fill="#FF6B5A" opacity="0.6" filter="url(#glow)"/>
    <path d="M0 0 C-11 -15 -17 -22 -17 -31 A17 17 0 0 1 17 -31 C17 -22 11 -15 0 0 Z" fill="#FF6B5A"/>
    <circle cx="0" cy="-31" r="6" fill="#FFE4DF"/>
  </g>

  <!-- app-killed chip, left corner of the floor -->
  <g transform="translate(468,196)">
    <rect width="106" height="30" rx="9" fill="#0E1524" stroke="#2A3A5C" stroke-width="1.1"/>
    <circle cx="17" cy="15" r="5.6" fill="none" stroke="#FF6B5A" stroke-width="1.6"/>
    <path d="M17 10.2 V15" stroke="#FF6B5A" stroke-width="1.6" stroke-linecap="round"/>
    <text x="30" y="19.6" font-size="11.5" font-weight="700" fill="#E8EDF7">app killed</text>
  </g>

  <!-- phone, lower right, iso like the floor -->
  <g transform="translate(60,16)">
    <g transform="matrix(0.866,0.5,-0.866,0.5,655,52)">
      <g transform="translate(118,116)">
        <rect x="-4" y="-6" width="72" height="132" rx="12" fill="#0B111E"/>
        <rect x="0" y="0" width="64" height="120" rx="9" fill="#232F4C"/>
        <rect x="4" y="5" width="56" height="110" rx="6" fill="#0F1830"/>

        <text x="10" y="19" font-size="9.5" font-weight="700" fill="#2DD4BF" letter-spacing="1">FENCES</text>

        <g font-size="8.6" fill="#C8D3E8">
          <circle cx="13" cy="32" r="2.6" fill="#2DD4BF"/>
          <text x="20" y="35">warehouse</text>
          <circle cx="13" cy="48" r="2.6" fill="none" stroke="#5A6C92" stroke-width="1.2"/>
          <text x="20" y="51">depot</text>
          <circle cx="13" cy="64" r="2.6" fill="none" stroke="#5A6C92" stroke-width="1.2"/>
          <text x="20" y="67">job-site</text>
        </g>

        <g>
          <rect x="8" y="82" width="48" height="16" rx="8" fill="#2DD4BF" opacity="0.5" filter="url(#glow)"/>
          <rect x="8" y="82" width="48" height="16" rx="8" fill="#2DD4BF"/>
          <text x="32" y="93" font-size="8.6" font-weight="700" fill="#0B2422" text-anchor="middle">ENTER</text>
        </g>
        <rect x="12" y="104" width="40" height="4" rx="2" fill="#1E2A47"/>
      </g>
    </g>
  </g>

  <!-- annotation -->
  <text x="850" y="322" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="end">app killed → fence still fires</text>
  <text x="850" y="341" font-size="12" fill="#64738F" text-anchor="end">POSTs to your server — zero PHP running</text>

</svg>
