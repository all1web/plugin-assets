<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1A2337"/>
      <stop offset="1" stop-color="#131B2B"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34C77B"/>
      <stop offset="1" stop-color="#8B7CF8"/>
    </linearGradient>
  </defs>

  <rect width="880" height="150" rx="16" fill="url(#bgDark)"/>

  <!-- === card 1: the app queues === -->
  <g transform="translate(34,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="#2E3D60" stroke-width="1.2"/>
    <g transform="translate(26,26)">
      <rect x="-9" y="-11" width="18" height="12" rx="2.2" fill="#8E9BB5"/>
      <path d="M -9,-11 L 0,-3.5 L 9,-11" fill="none" stroke="#1D2740" stroke-width="1.5"/>
      <path d="M -10,5 L -10,8 Q -10,10 -8,10 L 8,10 Q 10,10 10,8 L 10,5" fill="none" stroke="#5E6C8A" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">App queues a row</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">it records, it never sends</text>
  </g>

  <!-- === card 2: OpenClaw claims === -->
  <g transform="translate(246,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="#2E3D60" stroke-width="1.2"/>
    <g transform="translate(17,16)">
      <rect width="20" height="20" rx="5.5" fill="#F70515"/>
      <g transform="scale(0.4167)">
        <path d="M 34.5,31.5 L 40.5,37.5" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" fill="none"/>
        <path d="M 28,7.8 A 15,15 0 1 1 28,38.2 C 21,38.5 13,36.5 8,33 C 5.5,31.3 4.5,29.5 4.5,28 C 7.5,26.8 11,26.3 15,26 C 19,25.7 22,24.9 22.8,23 C 22,21.1 19,20.3 15,20 C 11,19.7 7.5,19.2 4.5,18 C 4.5,16.5 5.5,14.7 8,13 C 13,9.5 21,7.5 28,7.8 Z" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">OpenClaw claims</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">on a schedule, over MCP</text>
  </g>

  <!-- === card 3: said on your channel === -->
  <g transform="translate(458,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="#2E3D60" stroke-width="1.2"/>
    <g transform="translate(36,26)">
      <path d="M -11,-9 L 11,-9 Q 13,-9 13,-7 L 13,3 Q 13,5 11,5 L -2,5 L -7,10 L -7,5 L -11,5 Q -13,5 -13,3 L -13,-7 Q -13,-9 -11,-9 Z" fill="none" stroke="#34C77B" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M -8,-4 H 8 M -8,0 H 3" stroke="#34C77B" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">Said in chat</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">your channel, your target</text>
  </g>

  <!-- === card 4: acked only after the send confirms (highlighted) === -->
  <g transform="translate(670,33)">
    <rect width="180" height="84" rx="12" fill="#1D2740" stroke="url(#hi)" stroke-width="2"/>
    <g transform="translate(47,26)">
      <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#34C77B"/>
      <path d="M-4 0 L-1 3.5 L5 -3.5" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="101" y="31" font-size="13.5" font-weight="700" fill="#F0F4FB" text-anchor="middle">Then acked</text>
    <text x="90" y="56" font-size="11" fill="#7E8BA8" text-anchor="middle">after the channel confirms</text>
  </g>

</svg>
