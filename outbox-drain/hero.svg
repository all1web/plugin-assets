<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1B2438"/>
      <stop offset="1" stop-color="#141C2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EA3F7"/>
      <stop offset="1" stop-color="#8B7CF8"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#232F4C"/>
      <stop offset="1" stop-color="#1B2438"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="880" height="360" rx="20" fill="url(#bgDark)"/>

  <!-- === LEFT: eyebrow with the OpenClaw badge === -->
  <g transform="translate(56,49)">
    <g transform="scale(0.4375)">
      <rect width="48" height="48" rx="12" fill="#F70515"/>
      <path d="M 34.5,31.5 L 40.5,37.5" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" fill="none"/>
      <path d="M 28,7.8 A 15,15 0 1 1 28,38.2 C 21,38.5 13,36.5 8,33 C 5.5,31.3 4.5,29.5 4.5,28 C 7.5,26.8 11,26.3 15,26 C 19,25.7 22,24.9 22.8,23 C 22,21.1 19,20.3 15,20 C 11,19.7 7.5,19.2 4.5,18 C 4.5,16.5 5.5,14.7 8,13 C 13,9.5 21,7.5 28,7.8 Z" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="86" y="64" font-size="11" font-weight="700" letter-spacing="2.2" fill="#7E8BA8">OPENCLAW PLUGIN</text>

  <!-- === LEFT: value proposition === -->
  <text x="56" y="122" font-size="38" font-weight="700" fill="#F4F7FC">Drains your outbox.</text>
  <text x="56" y="168" font-size="38" font-weight="700" fill="url(#accent)">No model in the loop.</text>

  <text x="57" y="209" font-size="14.5" fill="#8E9BB5">Your app queues a row. On a schedule OpenClaw</text>
  <text x="57" y="230" font-size="14.5" fill="#8E9BB5">dials in, claims it and says it on your chat</text>
  <text x="57" y="251" font-size="14.5" fill="#8E9BB5">channel. Acked only once delivery is confirmed.</text>

  <!-- terminal chip: the real command, the real report line -->
  <rect x="56" y="274" width="332" height="60" rx="10" fill="#10182A" stroke="#263452" stroke-width="1.2"/>
  <text x="74" y="298" font-size="13.5" font-family="Consolas, Menlo, monospace"><tspan fill="#8E9BB5">$ </tspan><tspan fill="#4EC9B0">openclaw</tspan><tspan fill="#4EA3F7"> outbox</tspan></text>
  <text x="74" y="320" font-size="13.5" font-family="Consolas, Menlo, monospace"><tspan fill="#8E9BB5">myapp: </tspan><tspan fill="#C8D3E8">claimed 3, delivered 3, </tspan><tspan fill="#34C77B">acked 3</tspan></text>

  <!-- === RIGHT: iso floor, slab at TX=645 TY=58 === -->
  <g>
    <g transform="translate(0,10)">
      <g transform="matrix(0.866,0.5,-0.866,0.5,645,58)">
        <rect width="200" height="200" rx="10" fill="#101726"/>
      </g>
    </g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,645,58)">
      <rect width="200" height="200" rx="10" fill="url(#slabTop)"/>
      <g stroke="#2A3A5C" stroke-width="1" opacity="0.7">
        <path d="M0 50 H200 M0 100 H200 M0 150 H200"/>
        <path d="M50 0 V200 M100 0 V200 M150 0 V200"/>
      </g>

      <!-- the drain run: (20,40) down-left to (20,170), then down-right to (95,170) -->
      <path d="M 20,40 L 20,170 L 95,170" fill="none" stroke="#0D1422" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20,40 L 20,170 L 95,170" fill="none" stroke="#35476E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 25,46 L 25,175 M 26,175 L 95,175" fill="none" stroke="#141D33" stroke-width="3.4" stroke-linecap="round" opacity="0.75"/>
      <path d="M 16,40 L 16,166 M 20,166 L 95,166" fill="none" stroke="#5470AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

      <!-- flanges -->
      <g stroke="#0D1422" stroke-width="6" stroke-linecap="round">
        <path d="M 13,88 L 27,88"/>
        <path d="M 13,152 L 27,152"/>
        <path d="M 52,163 L 52,177"/>
        <path d="M 78,163 L 78,177"/>
      </g>

      <!-- messages draining through the run -->
      <g>
        <circle cx="20" cy="70" r="8" fill="#34C77B" opacity="0.45" filter="url(#glow)"/>
        <circle cx="20" cy="70" r="3.8" fill="#34C77B"/>
        <circle cx="20" cy="128" r="8" fill="#34C77B" opacity="0.45" filter="url(#glow)"/>
        <circle cx="20" cy="128" r="3.8" fill="#34C77B"/>
        <circle cx="65" cy="170" r="8" fill="#34C77B" opacity="0.45" filter="url(#glow)"/>
        <circle cx="65" cy="170" r="3.8" fill="#34C77B"/>
      </g>
    </g>
  </g>

  <!-- valve wheel on the long run: iso (20,110) -> screen (567,123) -->
  <g transform="translate(567,123)">
    <path d="M 0,-2 L 0,4" stroke="#93A2BF" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="7.5" fill="none" stroke="#93A2BF" stroke-width="2.6"/>
    <path d="M -7.5,-10 L 7.5,-10 M 0,-17.5 L 0,-2.5" stroke="#93A2BF" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- === OUTBOX hopper, planted at iso (20,40) -> screen (628,88) === -->
  <g transform="translate(628,88)">
    <ellipse cx="0" cy="2" rx="25" ry="7" fill="#000000" opacity="0.42"/>
    <path d="M -24,-46 L 24,-46 L 24,-18 L 7,-3 L -7,-3 L -24,-18 Z" fill="#232F4C" stroke="#2E3D60" stroke-width="1.4"/>
    <rect x="-24" y="-46" width="48" height="8" rx="3" fill="#0B111E"/>
    <text x="0" y="-30" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#8E9BB5" text-anchor="middle">OUTBOX</text>
    <g>
      <rect x="-15" y="-26" width="30" height="4.2" rx="2.1" fill="#34C77B" opacity="0.95"/>
      <rect x="-15" y="-20" width="30" height="4.2" rx="2.1" fill="#34C77B" opacity="0.72"/>
      <rect x="-12" y="-14" width="24" height="4.2" rx="2.1" fill="#34C77B" opacity="0.5"/>
    </g>
    <circle cx="24" cy="-48" r="9.5" fill="#F70515"/>
    <text x="24" y="-44" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <!-- === OpenClaw pump at the foot of the run: iso (95,170) -> screen (580,190) === -->
  <g transform="translate(580,190)">
    <ellipse cx="0" cy="2" rx="25" ry="7" fill="#000000" opacity="0.42"/>
    <rect x="-24" y="-48" width="48" height="48" rx="9" fill="#232F4C" stroke="#2E3D60" stroke-width="1.4"/>
    <rect x="-19.5" y="-43.5" width="39" height="39" rx="6" fill="#0F1830"/>
    <g transform="translate(-13,-40)">
      <rect width="26" height="26" rx="7" fill="#F70515"/>
      <g transform="scale(0.5417)">
        <path d="M 34.5,31.5 L 40.5,37.5" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" fill="none"/>
        <path d="M 28,7.8 A 15,15 0 1 1 28,38.2 C 21,38.5 13,36.5 8,33 C 5.5,31.3 4.5,29.5 4.5,28 C 7.5,26.8 11,26.3 15,26 C 19,25.7 22,24.9 22.8,23 C 22,21.1 19,20.3 15,20 C 11,19.7 7.5,19.2 4.5,18 C 4.5,16.5 5.5,14.7 8,13 C 13,9.5 21,7.5 28,7.8 Z" fill="#FFFFFF"/>
      </g>
    </g>
    <circle cx="15" cy="-39" r="4.4" fill="#34C77B" opacity="0.55" filter="url(#glowSoft)"/>
    <circle cx="15" cy="-39" r="2.4" fill="#34C77B"/>
    <rect x="-13" y="-10.5" width="18" height="3.6" rx="1.8" fill="#34C77B" opacity="0.75"/>
    <rect x="7" y="-10.5" width="6" height="3.6" rx="1.8" fill="#33436B"/>
  </g>

  <!-- discharge: claimed messages leaving the pump for the chat -->
  <path d="M 596,152 Q 650,150 700,196" fill="none" stroke="#34C77B" stroke-width="2" stroke-dasharray="3 7" opacity="0.5"/>
  <g transform="translate(641,159) rotate(19)">
    <rect x="-9.5" y="-6.5" width="19" height="13" rx="2.5" fill="#34C77B" opacity="0.45" filter="url(#glow)"/>
    <rect x="-9.5" y="-6.5" width="19" height="13" rx="2.5" fill="#34C77B"/>
    <path d="M -9.5,-6.5 L 0,1 L 9.5,-6.5" fill="none" stroke="#0B2422" stroke-width="1.4"/>
  </g>
  <g transform="translate(678,178) rotate(35)">
    <rect x="-9.5" y="-6.5" width="19" height="13" rx="2.5" fill="#34C77B" opacity="0.45" filter="url(#glow)"/>
    <rect x="-9.5" y="-6.5" width="19" height="13" rx="2.5" fill="#34C77B"/>
    <path d="M -9.5,-6.5 L 0,1 L 9.5,-6.5" fill="none" stroke="#0B2422" stroke-width="1.4"/>
  </g>

  <!-- no-model chip, front left of the floor -->
  <g transform="translate(462,218)">
    <rect width="100" height="30" rx="9" fill="#0E1524" stroke="#2A3A5C" stroke-width="1.1"/>
    <g transform="translate(18,15)">
      <path d="M 0,-7.5 C 1.1,-2.7 2.7,-1.1 7.5,0 C 2.7,1.1 1.1,2.7 0,7.5 C -1.1,2.7 -2.7,1.1 -7.5,0 C -2.7,-1.1 -1.1,-2.7 0,-7.5 Z" fill="#5E6C8A"/>
      <path d="M -8.5,8.5 L 8.5,-8.5" stroke="#FF6B5A" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="33" y="19.6" font-size="11.5" font-weight="700" fill="#E8EDF7">no model</text>
  </g>

  <!-- === the payoff: your chat, upright so it reads === -->
  <g transform="translate(700,116)">
    <rect x="4" y="6" width="130" height="172" rx="18" fill="#000000" opacity="0.3"/>
    <rect width="130" height="172" rx="18" fill="#0B111E" stroke="#232F4C" stroke-width="1.4"/>
    <rect x="7" y="7" width="116" height="158" rx="13" fill="#0F1830"/>
    <rect x="45" y="11" width="40" height="6" rx="3" fill="#0B111E"/>

    <rect x="15" y="26" width="16" height="16" rx="5" fill="#35476E"/>
    <text x="37" y="38" font-size="10.5" font-weight="700" fill="#E8EDF7">your chat</text>
    <circle cx="112" cy="34" r="3.2" fill="#34C77B"/>
    <path d="M 7,50 H 123" stroke="#1E2A47" stroke-width="1.2"/>

    <rect x="14" y="60" width="70" height="20" rx="10" fill="#1E2A47"/>
    <rect x="22" y="68" width="38" height="4" rx="2" fill="#33436B"/>

    <g>
      <rect x="18" y="90" width="98" height="26" rx="13" fill="#34C77B" opacity="0.45" filter="url(#glow)"/>
      <rect x="18" y="90" width="98" height="26" rx="13" fill="#34C77B"/>
      <text x="28" y="107" font-size="9.5" font-weight="700" fill="#0B2422">backup done</text>
      <g stroke="#0B2422" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 94,104 L 97,107 L 102,101"/>
        <path d="M 100,104 L 103,107 L 108,101"/>
      </g>
    </g>

    <g opacity="0.9">
      <rect x="34" y="122" width="82" height="24" rx="12" fill="#34C77B"/>
      <rect x="43" y="131" width="44" height="4" rx="2" fill="#0B2422" opacity="0.55"/>
      <g stroke="#0B2422" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 95,135 L 98,138 L 103,132"/>
        <path d="M 101,135 L 104,138 L 109,132"/>
      </g>
    </g>

    <rect x="46" y="152" width="38" height="4" rx="2" fill="#1E2A47"/>
  </g>

  <!-- annotation -->
  <text x="850" y="322" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="end">claimed &#8594; said in chat &#8594; acked</text>
  <text x="850" y="341" font-size="12" fill="#64738F" text-anchor="end">nothing is marked sent until the channel confirms</text>

</svg>
