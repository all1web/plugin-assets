<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#E1E9F8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.02"/>
    </radialGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C6E90" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5C6E90" stop-opacity="0"/>
    </radialGradient>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="150" rx="14" fill="url(#bg)"/>

  <!-- === step 1: one call from PHP === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,150,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(150,44)" filter="url(#tight)">
    <g transform="translate(0,5)"><rect x="-14" y="-26" width="28" height="50" rx="7" fill="#222B44"/></g>
    <rect x="-14" y="-26" width="28" height="50" rx="7" fill="#2B3550"/>
    <rect x="-10.5" y="-21" width="21" height="40" rx="4" fill="#F2F6FF"/>
    <g fill="none" stroke="#0EA5E9" stroke-linecap="round">
      <path d="M-7 -5 A9.5 9.5 0 0 1 7 -5" stroke-width="1.5" stroke-opacity="0.4"/>
      <path d="M-4.2 -8.4 A5.6 5.6 0 0 1 4.2 -8.4" stroke-width="1.5" stroke-opacity="0.7"/>
    </g>
    <circle cx="0" cy="-2.4" r="2.2" fill="#0284C7"/>
    <rect x="-7" y="6" width="14" height="2.6" rx="1.3" fill="#C3D0E6"/>
    <rect x="-7" y="11" width="9" height="2.4" rx="1.2" fill="#DCE4F3"/>
  </g>
  <text x="150" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">One call from PHP</text>
  <text x="150" y="143" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#6B7794" text-anchor="middle">Wifi::scan()</text>

  <!-- === step 2: the native radio sweep === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,440,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/>
      <g fill="none" stroke="#0EA5E9">
        <circle cx="33" cy="33" r="24" fill="url(#sweep)" stroke-opacity="0.30" stroke-width="1.6"/>
        <circle cx="33" cy="33" r="14" stroke-opacity="0.55" stroke-width="1.8"/>
      </g>
    </g>
  </g>
  <g transform="translate(440,58)">
    <ellipse cx="0" cy="9" rx="16" ry="6.4" fill="url(#contact)"/>
    <path d="M-6 -7 L-11 -20" stroke="#9DB0CE" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M6 -7 L11 -20" stroke="#9DB0CE" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-14 -2 L0 5 L0 12 L-14 5 Z" fill="#C9D6EC"/>
    <path d="M0 5 L14 -2 L14 5 L0 12 Z" fill="#B4C3E0"/>
    <path d="M0 -9 L14 -2 L0 5 L-14 -2 Z" fill="#F0F5FF"/>
    <circle cx="0" cy="-2" r="2.8" fill="#0EA5E9"/>
  </g>
  <text x="440" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Native radio sweep</text>
  <text x="440" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">every AP in range</text>

  <!-- === step 3: the ranked list, back in your code === -->
  <g filter="url(#tight)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="#C4D0E7"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,730,24)"><rect width="66" height="66" rx="11" fill="url(#tile)"/></g>
  </g>
  <g transform="translate(730,40)" filter="url(#tight)">
    <g transform="translate(0,6)"><rect x="-32" y="-20" width="64" height="44" rx="9" fill="#2C55C9"/></g>
    <rect x="-32" y="-20" width="64" height="44" rx="9" fill="#3B6FF5"/>
    <rect x="-24" y="-13" width="30" height="4.4" rx="2.2" fill="#FFFFFF" opacity="0.88"/>
    <g fill="#FFFFFF"><rect x="12" y="-13" width="2.6" height="4.4"/><rect x="16.4" y="-14.8" width="2.6" height="6.2"/><rect x="20.8" y="-16.6" width="2.6" height="8"/></g>
    <rect x="-24" y="-3" width="23" height="4.4" rx="2.2" fill="#FFFFFF" opacity="0.62"/>
    <g fill="#FFFFFF"><rect x="12" y="-3" width="2.6" height="4.4"/><rect x="16.4" y="-4.8" width="2.6" height="6.2"/><rect x="20.8" y="-6.6" width="2.6" height="8" opacity="0.35"/></g>
    <rect x="-24" y="7" width="27" height="4.4" rx="2.2" fill="#FFFFFF" opacity="0.45"/>
    <g fill="#FFFFFF"><rect x="12" y="7" width="2.6" height="4.4"/><rect x="16.4" y="5.2" width="2.6" height="6.2" opacity="0.35"/><rect x="20.8" y="3.4" width="2.6" height="8" opacity="0.35"/></g>
  </g>
  <text x="730" y="128" font-size="12.5" font-weight="700" fill="#1B2440" text-anchor="middle">Ranked list in your code</text>
  <text x="730" y="143" font-size="10.5" fill="#6B7794" text-anchor="middle">SSID · BSSID · signal</text>

  <!-- === arrows === -->
  <g stroke="#9DB0CE" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M222 62 H352"/>
    <path d="M512 62 H642"/>
  </g>
  <g fill="#9DB0CE">
    <path d="M352 62 L344 57.5 L344 66.5 Z"/>
    <path d="M642 62 L634 57.5 L634 66.5 Z"/>
  </g>

</svg>
