<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#DCE5F7"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF3FF"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.02"/>
    </radialGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C6E90" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5C6E90" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="11"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.24"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="360" rx="18" fill="url(#bg)"/>

  <!-- === LEFT: value proposition === -->
  <text x="56" y="120" font-size="38" font-weight="700" fill="#1B2440">Every radio</text>
  <text x="56" y="166" font-size="38" font-weight="700" fill="#0284C7">in the room.</text>

  <text x="57" y="207" font-size="14.5" fill="#5B6785">Scan every WiFi access point in range — SSID,</text>
  <text x="57" y="228" font-size="14.5" fill="#5B6785">BSSID, signal, channel — straight from Laravel.</text>
  <text x="57" y="249" font-size="14.5" fill="#5B6785">Android. No Kotlin, no GPS, no polling.</text>

  <g filter="url(#tight)">
    <rect x="56" y="277" width="286" height="42" rx="10" fill="#1B2440"/>
  </g>
  <text x="74" y="303" font-size="13.5" font-family="Consolas, Menlo, monospace" fill="#7DD3FC"><tspan fill="#FFB4A8">$networks</tspan> = Wifi::scan();</text>

  <!-- === RIGHT: isometric diorama === -->

  <!-- ground slab, 190x190 iso at (660,88) -->
  <g filter="url(#soft)">
    <g transform="translate(0,9)">
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect width="190" height="190" rx="15" fill="#BFCCE5"/>
      </g>
    </g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
      <rect width="190" height="190" rx="15" fill="url(#slabTop)"/>
      <g stroke="#CFDAEE" stroke-width="1.1" opacity="0.8">
        <path d="M0 56 H190 M0 112 H190 M0 158 H190"/>
        <path d="M48 0 V190 M104 0 V190 M152 0 V190"/>
      </g>

      <!-- radio sweep: rings on the ground plane -->
      <g fill="none" stroke="#0EA5E9">
        <circle cx="150" cy="140" r="38" fill="url(#sweep)" stroke-opacity="0.30" stroke-width="1.6"/>
        <circle cx="150" cy="140" r="22" stroke-opacity="0.55" stroke-width="1.8"/>
        <circle cx="52" cy="128" r="34" fill="url(#sweep)" stroke-opacity="0.26" stroke-width="1.5"/>
        <circle cx="52" cy="128" r="19" stroke-opacity="0.5" stroke-width="1.7"/>
      </g>
    </g>
  </g>

  <!-- props: access points standing on the slab -->
  <g transform="translate(668.7,233)">
    <ellipse cx="0" cy="8" rx="15" ry="6" fill="url(#contact)"/>
    <path d="M-5 -6 L-9 -17" stroke="#9DB0CE" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M5 -6 L9 -17" stroke="#9DB0CE" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M-12 -2 L0 4 L0 10 L-12 4 Z" fill="#C9D6EC"/>
    <path d="M0 4 L12 -2 L12 4 L0 10 Z" fill="#B4C3E0"/>
    <path d="M0 -8 L12 -2 L0 4 L-12 -2 Z" fill="#F0F5FF"/>
    <circle cx="0" cy="-2" r="2.4" fill="#0EA5E9"/>
  </g>
  <g transform="translate(594.2,178)">
    <ellipse cx="0" cy="7" rx="13" ry="5.4" fill="url(#contact)"/>
    <path d="M-4 -5 L-8 -15" stroke="#9DB0CE" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M4 -5 L8 -15" stroke="#9DB0CE" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-10 -2 L0 3 L0 8.5 L-10 3.5 Z" fill="#C9D6EC"/>
    <path d="M0 3 L10 -2 L10 3.5 L0 8.5 Z" fill="#B4C3E0"/>
    <path d="M0 -7 L10 -2 L0 3 L-10 -2 Z" fill="#F0F5FF"/>
    <circle cx="0" cy="-2" r="2.1" fill="#0EA5E9"/>
  </g>

  <!-- connectors, drawn beneath the floating cards -->
  <g stroke="#9DB0CE" stroke-width="1.3" fill="none">
    <path d="M692 90 L678 82 L668 75"/>
    <path d="M741 100 L736 85 L732 70"/>
    <path d="M708 139 L714 148 L721 157"/>
    <path d="M650 110 L628 111 L607 112"/>
  </g>
  <g fill="#FFFFFF" stroke="#9DB0CE" stroke-width="1.3">
    <rect x="674.5" y="78.5" width="7" height="7" rx="1.6"/>
    <rect x="732.5" y="81.5" width="7" height="7" rx="1.6"/>
    <rect x="710.5" y="144.5" width="7" height="7" rx="1.6"/>
    <rect x="624.5" y="107.5" width="7" height="7" rx="1.6"/>
  </g>

  <!-- === the phone, floating over the slab === -->
  <g filter="url(#soft)">
    <g transform="translate(16,-54)">
      <g transform="translate(0,10)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="62" y="28" width="60" height="116" rx="11" fill="#222B44"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="62" y="28" width="60" height="116" rx="11" fill="#2B3550"/>
        <rect x="67" y="35" width="50" height="102" rx="6" fill="url(#screen)"/>

        <text x="72" y="48" font-size="9" font-weight="700" fill="#1B2440">Wi-Fi</text>

        <rect x="72" y="54" width="40" height="30" rx="4" fill="#E7EFFD"/>
        <g fill="none" stroke="#0EA5E9" stroke-linecap="round">
          <path d="M85 76 A10 10 0 0 1 99 76" stroke-width="1.5" stroke-opacity="0.35"/>
          <path d="M88 73 A6.4 6.4 0 0 1 96 73" stroke-width="1.5" stroke-opacity="0.6"/>
        </g>
        <circle cx="92" cy="77.5" r="2.3" fill="#0284C7"/>

        <rect x="72" y="90" width="40" height="11" rx="3" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.8"/>
        <circle cx="78" cy="95.5" r="2.7" fill="#0EA5E9"/>
        <rect x="84" y="93" width="20" height="2.4" rx="1.2" fill="#41506F" opacity="0.7"/>
        <rect x="84" y="97.4" width="13" height="2" rx="1" fill="#93A2BF" opacity="0.7"/>

        <rect x="72" y="104" width="40" height="11" rx="3" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.8"/>
        <circle cx="78" cy="109.5" r="2.7" fill="#7DD3FC"/>
        <rect x="84" y="107" width="17" height="2.4" rx="1.2" fill="#41506F" opacity="0.45"/>
        <rect x="84" y="111.4" width="10" height="2" rx="1" fill="#93A2BF" opacity="0.5"/>

        <rect x="72" y="118" width="40" height="11" rx="3" fill="#FFFFFF" stroke="#E2E9F7" stroke-width="0.8"/>
        <circle cx="78" cy="123.5" r="2.7" fill="#C3D0E6"/>
        <rect x="84" y="121" width="19" height="2.4" rx="1.2" fill="#41506F" opacity="0.45"/>
        <rect x="84" y="125.4" width="8" height="2" rx="1" fill="#93A2BF" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- === card: the one call that starts the sweep === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-62)">
      <g transform="translate(0,7)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="-6" y="10" width="60" height="32" rx="7" fill="#0284C7"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="-6" y="10" width="60" height="32" rx="7" fill="#0EA5E9"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
          <path d="M2 24 A9 9 0 0 1 15 24"/>
          <path d="M5 27.4 A5 5 0 0 1 12 27.4"/>
        </g>
        <circle cx="8.5" cy="30.4" r="1.9" fill="#FFFFFF"/>
        <text x="21" y="27" font-size="11" font-weight="700" fill="#FFFFFF">SCAN</text>
        <rect x="21" y="31" width="26" height="2.6" rx="1.3" fill="#FFFFFF" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- === card: fresh results arrive as an event === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-96)">
      <g transform="translate(0,7)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="108" y="-4" width="76" height="30" rx="7" fill="#E0553F"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="108" y="-4" width="76" height="30" rx="7" fill="#FF6B5A"/>
        <path d="M120 4 L115 12 H119 L117.5 18 L123 10 H119 Z" fill="#FFFFFF"/>
        <text x="127" y="13.6" font-size="11" font-weight="700" fill="#FFFFFF">EVENT</text>
        <rect x="127" y="17" width="42" height="2.6" rx="1.3" fill="#FFFFFF" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- === card: the ranked list handed back to PHP === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-40)">
      <g transform="translate(0,7)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="146" y="74" width="68" height="42" rx="7" fill="#2C55C9"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="146" y="74" width="68" height="42" rx="7" fill="#3B6FF5"/>
        <text x="154" y="88" font-size="10" font-weight="700" fill="#FFFFFF">SSID</text>
        <g>
          <rect x="154" y="93" width="34" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.85"/>
          <g fill="#FFFFFF"><rect x="192" y="92.6" width="2.2" height="3.6"/><rect x="195.6" y="91.2" width="2.2" height="5"/><rect x="199.2" y="89.8" width="2.2" height="6.4"/></g>
          <rect x="154" y="99.5" width="27" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.62"/>
          <g fill="#FFFFFF"><rect x="192" y="99.1" width="2.2" height="3.6"/><rect x="195.6" y="97.7" width="2.2" height="5"/><rect x="199.2" y="96.3" width="2.2" height="6.4" opacity="0.35"/></g>
          <rect x="154" y="106" width="31" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.45"/>
          <g fill="#FFFFFF"><rect x="192" y="105.6" width="2.2" height="3.6"/><rect x="195.6" y="104.2" width="2.2" height="5" opacity="0.35"/><rect x="199.2" y="102.8" width="2.2" height="6.4" opacity="0.35"/></g>
        </g>
      </g>
    </g>
  </g>

  <!-- === chip: the signal reading itself === -->
  <g filter="url(#tight)">
    <g transform="translate(0,-34)">
      <g transform="translate(0,6)">
        <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
          <rect x="-30" y="92" width="56" height="26" rx="7" fill="#C6D3EB"/>
        </g>
      </g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,660,88)">
        <rect x="-30" y="92" width="56" height="26" rx="7" fill="#FFFFFF"/>
        <circle cx="-21" cy="103" r="4" fill="#0EA5E9" fill-opacity="0.25" stroke="#0EA5E9" stroke-width="1.2"/>
        <text x="-13" y="106" font-size="9" font-weight="700" fill="#41506F">-52 dBm</text>
        <rect x="-22" y="111" width="38" height="2.4" rx="1.2" fill="#DDE5F4"/>
      </g>
    </g>
  </g>

</svg>
