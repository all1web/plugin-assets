<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150">
  <!-- === actions-anywhere flow strip, isometric-diorama system (plugin-assets/STYLE.md) === -->
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#DCE5F7"/>
    </linearGradient>
    <linearGradient id="fslab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDFA"/>
    </linearGradient>
    <linearGradient id="forb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="880" height="150" fill="url(#fbg)"/>

  <!-- === tile 1: the config === -->
  <g transform="translate(180,58)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-64" y="-38" width="128" height="76" rx="14" fill="#BFCCE5"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-64" y="-38" width="128" height="76" rx="14" fill="url(#fslab)"/></g>
    <ellipse cx="0" cy="34" rx="34" ry="9" fill="#1B2440" opacity="0.10"/>
    <g transform="translate(0,-8)">
      <g transform="translate(0,5)"><g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-26" y="-32" width="52" height="64" rx="6" fill="#BFCCE5"/></g></g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,0,0)">
        <rect x="-26" y="-32" width="52" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="-18" y="-22" width="36" height="5" rx="2.5" fill="#9FD8B0"/>
        <rect x="-18" y="-11" width="28" height="5" rx="2.5" fill="#C3D0E6"/>
        <rect x="-18" y="0" width="33" height="5" rx="2.5" fill="#C3D0E6"/>
        <rect x="-18" y="11" width="22" height="5" rx="2.5" fill="#9DB0CE"/>
      </g>
    </g>
  </g>

  <!-- === arrow 1 === -->
  <g stroke="#6366F1" stroke-width="2.5" fill="none">
    <path d="M292 62 L342 62"/>
    <path d="M334 55 L343 62 L334 69"/>
  </g>

  <!-- === tile 2: the build === -->
  <g transform="translate(440,58)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-64" y="-38" width="128" height="76" rx="14" fill="#BFCCE5"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-64" y="-38" width="128" height="76" rx="14" fill="url(#fslab)"/></g>
    <ellipse cx="0" cy="34" rx="36" ry="9" fill="#1B2440" opacity="0.10"/>
    <g transform="translate(0,-6)">
      <g transform="translate(0,5)"><g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-34" y="-24" width="68" height="48" rx="8" fill="#101830"/></g></g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,0,0)">
        <rect x="-34" y="-24" width="68" height="48" rx="8" fill="#1B2440"/>
        <path d="M-8 -14 L-16 -1 L-9 -1 L-13 12 L-1 -3 L-8 -3 Z" fill="#6366F1"/>
        <rect x="2" y="-12" width="24" height="5" rx="2.5" fill="#5B6785"/>
        <rect x="2" y="-2" width="18" height="5" rx="2.5" fill="#5B6785"/>
        <rect x="2" y="8" width="21" height="5" rx="2.5" fill="#5B6785"/>
      </g>
    </g>
  </g>

  <!-- === arrow 2 === -->
  <g stroke="#6366F1" stroke-width="2.5" fill="none">
    <path d="M552 62 L602 62"/>
    <path d="M594 55 L603 62 L594 69"/>
  </g>

  <!-- === tile 3: the surfaces === -->
  <g transform="translate(706,58)">
    <g transform="translate(0,7)"><g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-64" y="-38" width="128" height="76" rx="14" fill="#BFCCE5"/></g></g>
    <g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-64" y="-38" width="128" height="76" rx="14" fill="url(#fslab)"/></g>
    <ellipse cx="-30" cy="30" rx="16" ry="6" fill="#1B2440" opacity="0.10"/>
    <ellipse cx="14" cy="38" rx="18" ry="6" fill="#1B2440" opacity="0.10"/>
    <ellipse cx="38" cy="26" rx="13" ry="5" fill="#1B2440" opacity="0.10"/>
    <circle cx="-30" cy="8" r="15" fill="url(#forb)"/>
    <circle cx="-30" cy="8" r="8" fill="#A5B4FC" opacity="0.7"/>
    <g transform="translate(14,14)">
      <g transform="translate(0,5)"><g transform="matrix(0.866,0.5,-0.866,0.5,0,0)"><rect x="-16" y="-11" width="32" height="22" rx="9" fill="#4F46E5"/></g></g>
      <g transform="matrix(0.866,0.5,-0.866,0.5,0,0)">
        <rect x="-16" y="-11" width="32" height="22" rx="9" fill="#6366F1"/>
        <path d="M2 -7 L-3 0 L1 0 L-1 6 L5 -2 L1 -2 Z" fill="#FFFFFF"/>
      </g>
    </g>
    <g transform="translate(36,8)" fill="#1B2440">
      <rect x="-9" y="-9" width="7" height="7"/>
      <rect x="1" y="-9" width="3" height="3"/>
      <rect x="5" y="-9" width="4" height="4"/>
      <rect x="-9" y="-1" width="3" height="3"/>
      <rect x="-4" y="0" width="5" height="4"/>
      <rect x="3" y="-1" width="6" height="6"/>
    </g>
  </g>

  <!-- === labels, horizontal in screen space === -->
  <text x="180" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B2440">You write config</text>
  <text x="180" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7794">actions in appintents.php</text>

  <text x="440" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B2440">We compile it in</text>
  <text x="440" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7794">native:run — no Swift, no Kotlin</text>

  <text x="706" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B2440">They run it anywhere</text>
  <text x="706" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7794">Siri · Spotlight · shade · NFC &amp; QR</text>
</svg>
