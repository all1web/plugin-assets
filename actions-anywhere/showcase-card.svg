<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1023"/>
      <stop offset="1" stop-color="#1c1440"/>
    </linearGradient>
    <linearGradient id="siri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddcff"/>
      <stop offset="0.5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23244a"/>
      <stop offset="1" stop-color="#181a38"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Actions Anywhere!</text>
  <text x="80" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#b9bce0">One Laravel config &#183; every OS surface</text>

  <!-- Siri waveform -->
  <g transform="translate(80, 226)">
    <path d="M0 24 Q 22 -8, 44 24 T 88 24 T 132 24 T 176 24 T 220 24 T 264 24 T 308 24"
          fill="none" stroke="url(#siri)" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 24 Q 22 56, 44 24 T 88 24 T 132 24 T 176 24 T 220 24 T 264 24 T 308 24"
          fill="none" stroke="url(#siri)" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Surface chips, two rows -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#ffffff">
    <rect x="80" y="306" rx="18" ry="18" width="232" height="62" fill="url(#chip)" stroke="#3a3d6e" stroke-width="2"/>
    <text x="106" y="345">&#127908;  Siri phrases</text>

    <rect x="332" y="306" rx="18" ry="18" width="212" height="62" fill="url(#chip)" stroke="#3a3d6e" stroke-width="2"/>
    <text x="358" y="345">&#128269;  Spotlight</text>

    <rect x="564" y="306" rx="18" ry="18" width="268" height="62" fill="url(#chip)" stroke="#3a3d6e" stroke-width="2"/>
    <text x="590" y="345">&#9889;  Shortcuts app</text>

    <rect x="80" y="386" rx="18" ry="18" width="284" height="62" fill="url(#chip)" stroke="#3a3d6e" stroke-width="2"/>
    <text x="106" y="425">&#127899;&#65039;  Quick Settings</text>

    <rect x="384" y="386" rx="18" ry="18" width="212" height="62" fill="url(#chip)" stroke="#3a3d6e" stroke-width="2"/>
    <text x="410" y="425">&#127991;&#65039;  NFC tags</text>

    <rect x="616" y="386" rx="18" ry="18" width="216" height="62" fill="url(#chip)" stroke="#3a3d6e" stroke-width="2"/>
    <text x="642" y="425">&#128248;  QR codes</text>
  </g>

  <!-- Code chip -->
  <rect x="80" y="478" rx="14" ry="14" width="752" height="86" fill="#0f1023" stroke="#34375f" stroke-width="2"/>
  <text x="106" y="514" font-family="Consolas, Menlo, monospace" font-size="21" fill="#7ee0a3">'phrases' =&gt; ['Log water in ${applicationName}'],</text>
  <text x="106" y="546" font-family="Consolas, Menlo, monospace" font-size="21" fill="#8a8fc0">// no Swift, no Kotlin, no Xcode</text>

  <!-- Phone -->
  <g transform="translate(902, 96)">
    <rect x="0" y="0" rx="40" ry="40" width="230" height="440" fill="url(#chip)" stroke="#3a3d6e" stroke-width="3"/>
    <rect x="78" y="18" rx="10" ry="10" width="74" height="20" fill="#0f1023"/>

    <rect x="22" y="66" rx="12" ry="12" width="186" height="66" fill="#1d2a5e"/>
    <circle cx="56" cy="99" r="19" fill="url(#siri)"/>
    <path d="M56 89 v11 m0 0 a6.5 6.5 0 1 1 -0.1 0" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <text x="86" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Log water</text>
    <text x="86" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0d0">Siri &#183; Spotlight</text>

    <rect x="22" y="146" rx="12" ry="12" width="186" height="66" fill="#1d2a5e" opacity="0.72"/>
    <circle cx="56" cy="179" r="19" fill="#31356b"/>
    <text x="86" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Clock in</text>
    <text x="86" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0d0">Quick Settings tile</text>

    <rect x="22" y="226" rx="12" ry="12" width="186" height="66" fill="#1d2a5e" opacity="0.52"/>
    <circle cx="56" cy="259" r="19" fill="#31356b"/>
    <text x="86" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Check in</text>
    <text x="86" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0d0">NFC &#183; QR</text>

    <rect x="22" y="312" rx="12" ry="12" width="186" height="44" fill="#0f1023" stroke="#34375f" stroke-width="1.5"/>
    <text x="40" y="340" font-family="Consolas, Menlo, monospace" font-size="14" fill="#7ee0a3">&#8220;Logged.&#8221;</text>
  </g>
</svg>
