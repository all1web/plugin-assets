<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1023"/>
      <stop offset="1" stop-color="#1c1440"/>
    </linearGradient>
    <linearGradient id="siri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddcff"/>
      <stop offset="0.5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23244a"/>
      <stop offset="1" stop-color="#181a38"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">nativephp-actions-anywhere</text>
  <text x="80" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#b9bce0">Siri · Spotlight · Quick Settings · NFC &amp; QR</text>
  <text x="80" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#b9bce0">One Laravel config. Actions anywhere.</text>

  <!-- Spoken phrase bubble -->
  <rect x="80" y="300" rx="26" ry="26" width="520" height="64" fill="#ffffff" opacity="0.09"/>
  <text x="110" y="341" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff">&#8220;Hey Siri, log water in <tspan font-weight="700">YourApp</tspan>&#8221;</text>

  <!-- Siri waveform -->
  <g transform="translate(80, 420)">
    <path d="M0 40 Q 30 -10, 60 40 T 120 40 T 180 40 T 240 40 T 300 40 T 360 40 T 420 40 T 480 40"
          fill="none" stroke="url(#siri)" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 40 Q 30 90, 60 40 T 120 40 T 180 40 T 240 40 T 300 40 T 360 40 T 420 40 T 480 40"
          fill="none" stroke="url(#siri)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Reply -->
  <rect x="80" y="510" rx="20" ry="20" width="250" height="52" fill="url(#siri)" opacity="0.22"/>
  <text x="110" y="544" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">&#8220;Logged.&#8221;</text>

  <!-- Phone -->
  <g transform="translate(800, 70)">
    <rect x="0" y="0" rx="46" ry="46" width="360" height="560" fill="url(#phone)" stroke="#3a3d6e" stroke-width="3"/>
    <rect x="120" y="22" rx="12" ry="12" width="120" height="26" fill="#0f1023"/>
    <!-- config card -->
    <rect x="28" y="80" rx="14" ry="14" width="304" height="200" fill="#0f1023" stroke="#34375f" stroke-width="1.5"/>
    <text x="48" y="115" font-family="Consolas, Menlo, monospace" font-size="17" fill="#8a8fc0">// config/appintents.php</text>
    <text x="48" y="145" font-family="Consolas, Menlo, monospace" font-size="17" fill="#7ee0a3">'log-water' =&gt; [</text>
    <text x="64" y="173" font-family="Consolas, Menlo, monospace" font-size="17" fill="#d8d9f0">'phrases' =&gt; ['Log water</text>
    <text x="80" y="199" font-family="Consolas, Menlo, monospace" font-size="17" fill="#d8d9f0">in ${applicationName}'],</text>
    <text x="64" y="227" font-family="Consolas, Menlo, monospace" font-size="17" fill="#d8d9f0">'dialog' =&gt; 'Logged.',</text>
    <text x="48" y="255" font-family="Consolas, Menlo, monospace" font-size="17" fill="#7ee0a3">],</text>
    <!-- arrow -->
    <g transform="translate(180, 300)">
      <path d="M0 0 L0 44" stroke="#7a5cff" stroke-width="5" stroke-linecap="round"/>
      <path d="M-12 32 L0 48 L12 32" fill="none" stroke="#7a5cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- shortcut tile -->
    <rect x="28" y="370" rx="14" ry="14" width="304" height="76" fill="#1d2a5e"/>
    <circle cx="70" cy="408" r="24" fill="url(#siri)"/>
    <path d="M70 396 v14 m0 0 a8 8 0 1 1 -0.1 0" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="108" y="401" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Log water</text>
    <text x="108" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa0d0">App Shortcut &#183; Siri &#183; Spotlight</text>
    <!-- second tile -->
    <rect x="28" y="458" rx="14" ry="14" width="304" height="76" fill="#1d2a5e" opacity="0.65"/>
    <circle cx="70" cy="496" r="24" fill="#31356b"/>
    <text x="108" y="489" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Start workout</text>
    <text x="108" y="516" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa0d0">Opens the app</text>
  </g>
</svg>
