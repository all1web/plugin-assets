<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1023"/>
      <stop offset="1" stop-color="#1c1440"/>
    </linearGradient>
    <linearGradient id="siri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddcff"/>
      <stop offset="0.5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23244a"/>
      <stop offset="1" stop-color="#181a38"/>
    </linearGradient>
  </defs>

  <rect width="880" height="360" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="56" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Actions Anywhere!</text>
  <text x="56" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#b9bce0">Siri &#183; Spotlight &#183; Quick Settings &#183; NFC &amp; QR</text>
  <text x="56" y="147" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#b9bce0">One Laravel config. No Swift, no Kotlin.</text>

  <!-- Spoken phrase bubble -->
  <rect x="56" y="180" rx="19" ry="19" width="392" height="46" fill="#ffffff" opacity="0.09"/>
  <text x="78" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">&#8220;Hey Siri, log water in <tspan font-weight="700">YourApp</tspan>&#8221;</text>

  <!-- Siri waveform -->
  <g transform="translate(56, 254)">
    <path d="M0 22 Q 21 -6, 42 22 T 84 22 T 126 22 T 168 22 T 210 22 T 252 22 T 294 22 T 336 22"
          fill="none" stroke="url(#siri)" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 22 Q 21 50, 42 22 T 84 22 T 126 22 T 168 22 T 210 22 T 252 22 T 294 22 T 336 22"
          fill="none" stroke="url(#siri)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Reply -->
  <rect x="56" y="300" rx="15" ry="15" width="176" height="38" fill="url(#siri)" opacity="0.22"/>
  <text x="78" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff">&#8220;Logged.&#8221;</text>

  <!-- Surface icon column: the six ways in, bridging copy and device -->
  <g transform="translate(512, 0)">
    <!-- connector spine -->
    <path d="M0 44 L0 334" stroke="#7a5cff" stroke-width="1.2" opacity="0.28"/>

    <!-- Siri: microphone -->
    <g transform="translate(0, 58)">
      <circle r="20" fill="url(#siri)"/>
      <rect x="-3.5" y="-9" width="7" height="11" rx="3.5" fill="#ffffff"/>
      <path d="M-6.5 0.5 a6.5 6.5 0 0 0 13 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 7 L0 10.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Spotlight: magnifier -->
    <g transform="translate(0, 110)">
      <circle r="20" fill="url(#siri)"/>
      <circle cx="-1.5" cy="-1.5" r="5.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M2.6 2.6 L7.6 7.6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Shortcuts app: bolt -->
    <g transform="translate(0, 162)">
      <circle r="20" fill="url(#siri)"/>
      <path d="M1.5 -9.5 L-6 1 L-1 1 L-2.5 9.5 L6 -1.5 L0.5 -1.5 Z" fill="#ffffff"/>
    </g>

    <!-- Quick Settings: sliders -->
    <g transform="translate(0, 214)">
      <circle r="20" fill="url(#siri)"/>
      <rect x="-8.5" y="-6" width="17" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="3.5" cy="-4.5" r="3.2" fill="#ffffff"/>
      <rect x="-8.5" y="3" width="17" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="-3.5" cy="4.5" r="3.2" fill="#ffffff"/>
    </g>

    <!-- NFC: emitting arcs -->
    <g transform="translate(0, 266)">
      <circle r="20" fill="url(#siri)"/>
      <circle cx="-7" cy="0" r="2.4" fill="#ffffff"/>
      <path d="M-3 -4.5 a5 5 0 0 1 0 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M0.5 -8 a9 9 0 0 1 0 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M4 -11 a12.5 12.5 0 0 1 0 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- QR code -->
    <g transform="translate(0, 318)">
      <circle r="20" fill="url(#siri)"/>
      <g fill="#ffffff">
        <rect x="-9" y="-9" width="7" height="7" rx="1.4"/>
        <rect x="2" y="-9" width="7" height="7" rx="1.4"/>
        <rect x="-9" y="2" width="7" height="7" rx="1.4"/>
        <rect x="2.5" y="2.5" width="3" height="3"/>
        <rect x="6.5" y="6" width="2.5" height="3"/>
        <rect x="2.5" y="7.5" width="2.5" height="2"/>
      </g>
    </g>
  </g>

  <!-- Phone -->
  <g transform="translate(576, 18)">
    <rect x="0" y="0" rx="32" ry="32" width="252" height="324" fill="url(#phone)" stroke="#3a3d6e" stroke-width="2.5"/>
    <rect x="86" y="14" rx="8" ry="8" width="80" height="17" fill="#0f1023"/>

    <!-- config card -->
    <rect x="20" y="48" rx="10" ry="10" width="212" height="112" fill="#0f1023" stroke="#34375f" stroke-width="1.2"/>
    <text x="34" y="70" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8fc0">// config/appintents.php</text>
    <text x="34" y="90" font-family="Consolas, Menlo, monospace" font-size="11" fill="#7ee0a3">'log-water' =&gt; [</text>
    <text x="45" y="108" font-family="Consolas, Menlo, monospace" font-size="11" fill="#d8d9f0">'phrases' =&gt; ['Log water</text>
    <text x="56" y="125" font-family="Consolas, Menlo, monospace" font-size="11" fill="#d8d9f0">in ${applicationName}'],</text>
    <text x="45" y="142" font-family="Consolas, Menlo, monospace" font-size="11" fill="#d8d9f0">'dialog' =&gt; 'Logged.',</text>
    <text x="34" y="156" font-family="Consolas, Menlo, monospace" font-size="11" fill="#7ee0a3">],</text>

    <!-- arrow -->
    <g transform="translate(126, 168)">
      <path d="M0 0 L0 24" stroke="#7a5cff" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M-8 17 L0 26 L8 17" fill="none" stroke="#7a5cff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- shortcut tile -->
    <rect x="20" y="204" rx="10" ry="10" width="212" height="50" fill="#1d2a5e"/>
    <circle cx="49" cy="229" r="16" fill="url(#siri)"/>
    <path d="M49 221 v9 m0 0 a5.4 5.4 0 1 1 -0.1 0" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <text x="74" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Log water</text>
    <text x="74" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#9aa0d0">Siri &#183; Spotlight &#183; tile &#183; NFC</text>

    <!-- second tile -->
    <rect x="20" y="262" rx="10" ry="10" width="212" height="50" fill="#1d2a5e" opacity="0.6"/>
    <circle cx="49" cy="287" r="16" fill="#31356b"/>
    <text x="74" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Start workout</text>
    <text x="74" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#9aa0d0">Opens the app</text>
  </g>
</svg>
